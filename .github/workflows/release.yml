name: Release

# 打 tag（v1.2.3）即自动出包并发布 Release；也可以在 Actions 页手动跑一次只出产物。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  # ================= Windows：NSIS 安装包 + 便携包 =================
  windows:
    name: Windows (setup + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: 构建（NSIS 安装包）
        run: pnpm tauri build --bundles nsis

      - name: 收集产物（安装包 + 便携包）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/
          $bin = "src-tauri/target/release/huangguo-client.exe"
          if (-not (Test-Path $bin)) {
            $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $bin "artifacts/HGhub.exe"
          Compress-Archive -Path "artifacts/HGhub.exe" -DestinationPath "artifacts/HGhub_${v}_x64_portable.zip" -Force
          Remove-Item "artifacts/HGhub.exe"
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  # ================= Android：按 ABI 分包 + 签名 =================
  android:
    name: Android (split per ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu runner 自带 Android SDK，不再用 android-actions/setup-android（它的 license 交互会卡住）
      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 APK（按 ABI 分包）
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64

      - name: 签名 APK（缺 secret 时出未签名包）
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          APK_DIR=src-tauri/gen/android/app/build/outputs/apk
          mkdir -p artifacts
          # 与 iOS 同一套策略：没有签名材料就退化成未签名包，否则 Android 任务会把
          # needs 里包含它的 Release 发布整个卡死。
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::缺少 ANDROID_KEY_BASE64 secret，输出未签名 APK（装到设备前需自行签名）"
            found=0
            for f in $(find "$APK_DIR" -name '*-release*.apk'); do
              abi="$(basename "$(dirname "$(dirname "$f")")")"
              cp "$f" "artifacts/HGhub_${VERSION}_${abi}_unsigned.apk"
              found=$((found+1))
            done
            if [ "$found" -eq 0 ]; then echo "::error::没有找到 release APK"; exit 1; fi
            ls -lh artifacts
            exit 0
          fi
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          found=0
          for f in $(find "$APK_DIR" -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            out="artifacts/HGhub_${VERSION}_${abi}.apk"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3
            found=$((found+1))
          done
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 release APK"; exit 1; fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*
          if-no-files-found: error

  # ================= macOS：通用二进制 .app + .dmg =================
  macos:
    name: macOS (universal dmg + app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos

      - run: pnpm install --frozen-lockfile

      # 未配置 APPLE_SIGNING_IDENTITY / 公证密钥时出的是未签名包，
      # 首次打开需要「右键 → 打开」或 xattr -dr com.apple.quarantine。
      - name: 构建（.app + .dmg，arm64 + x86_64）
        run: pnpm tauri build --bundles app,dmg --target universal-apple-darwin

      - name: 收集产物
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"
          OUT="$PWD/artifacts"
          mkdir -p "$OUT"
          cp "$BUNDLE"/dmg/*.dmg "$OUT"/
          # .app 再打一份 zip，方便不想装 dmg 的人直接用（保留 .app 目录结构，不能压平）
          (cd "$BUNDLE/macos" && zip -qry "$OUT/HGhub_${V}_universal.zip" *.app)
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/*
          if-no-files-found: error

  # ================= iOS：IPA（有证书出签名包，没有就出未签名包） =================
  ios:
    name: iOS (IPA)
    runs-on: macos-latest
    env:
      # secret 缺省时 GitHub 注入的是空字符串，而 tauri-cli 把 APPLE_DEVELOPMENT_TEAM 当作覆盖值，
      # 空串会让 `tauri ios init/build` 直接报 `apple.development-team is empty`。
      # 未签名路径用占位 Team ID：后面 xcodebuild 关掉签名，它不参与实际签名。
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || 'AAAAAAAAAA' }}
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - name: 检查签名配置
        id: sign
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE }}
          TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          PROFILE: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          if [ -n "${CERT:-}" ] && [ -n "${TEAM:-}" ] && [ -n "${PROFILE:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::缺少 IOS_CERTIFICATE / APPLE_DEVELOPMENT_TEAM / IOS_MOBILE_PROVISION，本次出未签名 IPA（需自行用 AltStore/Sideloadly 等重签后才能装到 iPhone）"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - run: pnpm install --frozen-lockfile

      - name: 确保 CocoaPods
        run: |
          set -euo pipefail
          command -v pod >/dev/null 2>&1 || brew install cocoapods
          pod --version

      - name: 生成 iOS 工程
        run: pnpm tauri ios init --ci

      - if: steps.sign.outputs.ready == 'true'
        name: 导入证书与描述文件
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          # 不设 partition-list 时 codesign 会静默失败（CI 上最常见的一类「签不出包」）
          security set-keychain-settings -lut 21600 "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC" > /dev/null
          CERT_P12="$RUNNER_TEMP/dist.p12"
          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERT_P12"
          security import "$CERT_P12" -k "$KC" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_P12"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_MOBILE_PROVISION" | base64 --decode > "$PROFILE_DIR/hghub.mobileprovision"
          security list-keychains -d user -s "$KC" "$HOME/Library/Keychains/login.keychain-db"
          xcodebuild -version

      - if: steps.sign.outputs.ready == 'true'
        name: 编译并导出签名 IPA
        run: |
          set -euo pipefail
          pnpm tauri ios build --export-method debugging --target aarch64

      # 没有证书时走这条：tauri 的 archive→export 流程强制要签名身份，所以只借
      # `tauri ios build --open` 把前端装好并起那个 xcode-script 依赖的 JSON-RPC
      # （它写完 *-server-addr 就死循环挂住不退出），编译交给不带签名的 xcodebuild。
      - if: steps.sign.outputs.ready != 'true'
        name: 编译未签名 .app 并打成 IPA
        env:
          IPA_NAME: HGhub_${{ steps.ver.outputs.version }}_unsigned.ipa
        run: |
          set -euo pipefail
          ADDR="${TMPDIR:-/tmp}/com.hghub.huangguo-server-addr"
          rm -f "$ADDR"
          pnpm tauri ios build --open > "$RUNNER_TEMP/tauri-open.log" 2>&1 &
          RPC=$!
          trap 'kill "$RPC" 2>/dev/null || true' EXIT
          for _ in $(seq 1 150); do
            [ -e "$ADDR" ] && break
            kill -0 "$RPC" 2>/dev/null || { cat "$RUNNER_TEMP/tauri-open.log"; exit 1; }
            sleep 2
          done
          test -e "$ADDR" || { echo "::error::tauri 没有写出 $ADDR"; cat "$RUNNER_TEMP/tauri-open.log"; exit 1; }
          xcodebuild -project src-tauri/gen/apple/huangguo-client.xcodeproj \
            -scheme huangguo-client_iOS \
            -configuration release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath src-tauri/gen/apple/unsigned-build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build
          APP="$(find src-tauri/gen/apple/unsigned-build/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)"
          test -n "$APP" || { echo "::error::没找到 .app"; exit 1; }
          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          mkdir -p artifacts
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/artifacts/$IPA_NAME" Payload)
          codesign -dv "$STAGE/Payload/"*.app >/dev/null 2>&1 \
            && echo "::warning::产物竟然是已签名的" \
            || echo "确认未签名：$(basename "$APP")"
          ls -lh artifacts

      - if: steps.sign.outputs.ready == 'true'
        name: 收集签名产物
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # BSD find 的 -maxdepth 必须写在 -name 前面，否则会当错误参数
          find src-tauri/gen/apple -maxdepth 5 -name '*.ipa' -print -exec cp {} artifacts/ \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: artifacts/*
          if-no-files-found: error

  # ================= 发布 =================
  release:
    name: Publish GitHub Release
    needs: [windows, macos, ios, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true